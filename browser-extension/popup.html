<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSMaker Chrome 연결</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>SSMaker Chrome 연결</h1>
      <p id="status" class="status">연결 상태를 확인하고 있어요.</p>
      <label for="code">SSMaker에 표시된 6자리 연결 코드</label>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
      <button id="pair" type="button">연결하기</button>
      <p class="help">
        쿠키나 비밀번호는 읽지 않습니다. 공개 검색 결과의 영상 페이지 주소만 SSMaker에 전달합니다.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

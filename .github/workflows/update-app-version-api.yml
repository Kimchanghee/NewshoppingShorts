name: Update App Version API

on:
  push:
    tags:
      - 'metadata-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.4.39'
        required: true
      file_hash:
        description: 'Optional installer SHA256. If omitted, the workflow downloads the release asset and computes it.'
        required: false
      release_notes:
        description: 'Release notes shown in-app/website (optional)'
        required: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#metadata-v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Resolve installer hash
        id: hash
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          HASH="${{ github.event.inputs.file_hash }}"
          if [[ -z "$HASH" ]]; then
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/SSMaker_Setup_v${VERSION}.exe"
            curl -L --fail --retry 3 --retry-delay 5 -o installer.exe "$DOWNLOAD_URL"
            HASH="$(sha256sum installer.exe | awk '{print $1}')"
          fi
          echo "FILE_HASH=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Resolved SHA256: ${HASH}"

      - name: Update server version API
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          FILE_HASH: ${{ steps.hash.outputs.FILE_HASH }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          APP_VERSION_API_BASE_URL: ${{ secrets.APP_VERSION_API_BASE_URL }}
          APP_VERSION_UPDATE_API_KEY: ${{ secrets.APP_VERSION_UPDATE_API_KEY }}
          APP_VERSION_UPDATE_HMAC_KEY: ${{ secrets.APP_VERSION_UPDATE_HMAC_KEY }}
        run: |
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          version = os.environ["VERSION"].strip()
          repository = os.environ["REPOSITORY"].strip()
          def clean_secret(name, default=""):
              return (os.environ.get(name) or default).strip().lstrip("\ufeff").strip()

          api_base_url = clean_secret("APP_VERSION_API_BASE_URL", "https://newshopping-shorts-auth.vercel.app").rstrip("/")
          parsed_api = urllib.parse.urlparse(api_base_url)
          allowed_origins = {
              "https://newshopping-shorts-auth.vercel.app",
          }
          origin = f"{parsed_api.scheme}://{parsed_api.netloc}"
          if origin not in allowed_origins or parsed_api.path not in ("", "/") or parsed_api.query or parsed_api.fragment:
              raise SystemExit("APP_VERSION_API_BASE_URL is not an approved update origin")
          download_url = f"https://github.com/{repository}/releases/download/v{version}/SSMaker_Setup_v{version}.exe"

          payload = {
              "version": version,
              "download_url": download_url,
              "release_notes": (os.environ.get("RELEASE_NOTES") or f"SSMaker v{version} 업데이트").strip(),
              "is_mandatory": False,
              "file_hash": os.environ["FILE_HASH"].strip(),
          }
          body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")

          token = clean_secret("APP_VERSION_UPDATE_API_KEY")
          if not token:
              raise SystemExit("APP_VERSION_UPDATE_API_KEY is required")
          signing_key = clean_secret("APP_VERSION_UPDATE_HMAC_KEY")
          signature = ""
          if signing_key:
              signature = hmac.new(signing_key.encode("utf-8"), body, hashlib.sha256).hexdigest()

          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {token}",
          }
          if signature:
              headers["X-Update-Signature"] = signature
          request = urllib.request.Request(
              f"{api_base_url}/app/version/update",
              data=body,
              headers=headers,
              method="POST",
          )
          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(req.full_url, code, "Redirect refused", headers, fp)
          opener = urllib.request.build_opener(RejectRedirects)
          for attempt in range(1, 6):
              try:
                  with opener.open(request, timeout=30) as response:
                      print(f"Server version updated: {response.status}")
                      print(ascii(response.read().decode("utf-8", errors="replace")))
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code < 500 or attempt == 5:
                      raise
                  print(f"Version update attempt {attempt} returned HTTP {exc.code}; retrying")
                  time.sleep(3)

          verified = None
          for attempt in range(1, 9):
              verify_request = urllib.request.Request(
                  f"{api_base_url}/app/version?verify={time.time_ns()}",
                  headers={"Cache-Control": "no-cache", "User-Agent": "SSMaker-Release-Verification"},
              )
              with urllib.request.urlopen(verify_request, timeout=30) as response:
                  verified = json.loads(response.read().decode("utf-8"))
              if verified.get("version") == version and verified.get("file_hash") == payload["file_hash"]:
                  break
              print(
                  f"Version API verification attempt {attempt} returned "
                  f"{verified.get('version')}; retrying"
              )
              time.sleep(2)
          else:
              raise SystemExit(
                  f"Version API verification failed: expected {version}, got {verified.get('version')}"
              )
          print(f"Server version verified: {verified['version']}")

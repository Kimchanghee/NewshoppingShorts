name: Build and Deploy

on:
  push:
    tags:
      - 'v*'  # v1.0.2, v1.1.0 등 버전 태그 푸시 시 실행
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version already committed in version.json and auto_updater.py
        required: true
        type: string
      publish:
        description: Publish a GitHub release and update the version API (public signing only)
        required: true
        default: false
        type: boolean
      signing_mode:
        description: Public PKI release or nonpublished legacy-signer transition candidate
        required: true
        default: public
        type: choice
        options:
          - public
          - integrity-bridge

permissions:
  contents: read

concurrency:
  group: signed-release-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_policy.outputs.version }}
      publish: ${{ steps.release_policy.outputs.publish }}
      signing_mode: ${{ steps.release_policy.outputs.signing_mode }}
      file_hash: ${{ steps.hash.outputs.FILE_HASH }}
      file_size: ${{ steps.hash.outputs.FILE_SIZE }}

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: Set up Python 3.11 (release runtime)
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11.9'

    - name: Cache pip packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-release.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --disable-pip-version-check --require-hashes -r requirements-release.lock
        python -m pip check
        python -c "import sys; import PyInstaller; assert PyInstaller.__version__ == '6.19.0', PyInstaller.__version__; print('python=', sys.executable); print('pyinstaller=', PyInstaller.__version__)"

    - name: Install Inno Setup
      run: choco install innosetup --version=6.4.3 --source=https://community.chocolatey.org/api/v2/ --require-checksums --fail-on-unfound --allow-downgrade --no-progress -y

    - name: Install Tesseract OCR
      shell: pwsh
      run: |
        choco install tesseract --version=5.5.0.20241111 --source=https://community.chocolatey.org/api/v2/ --require-checksums --fail-on-unfound --allow-downgrade --no-progress -y

        $candidates = @()
        $cmd = Get-Command tesseract -ErrorAction SilentlyContinue
        if ($cmd -and $cmd.Source) {
          $candidates += $cmd.Source
        }
        $candidates += @(
          "C:\Program Files\Tesseract-OCR\tesseract.exe",
          "C:\Program Files (x86)\Tesseract-OCR\tesseract.exe",
          (Join-Path $env:LOCALAPPDATA "Programs\Tesseract-OCR\tesseract.exe")
        )
        $candidates += Get-ChildItem -Path "C:\ProgramData\chocolatey" -Recurse -Filter "tesseract.exe" -ErrorAction SilentlyContinue |
          Select-Object -ExpandProperty FullName

        $tesseractExe = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
        if (-not $tesseractExe) {
          throw "Tesseract executable was not found after installation."
        }

        $tessRoot = Split-Path $tesseractExe -Parent
        $tessdataCandidates = @(
          (Join-Path $tessRoot "tessdata"),
          "C:\Program Files\Tesseract-OCR\tessdata",
          "C:\Program Files (x86)\Tesseract-OCR\tessdata",
          (Join-Path $env:LOCALAPPDATA "Programs\Tesseract-OCR\tessdata")
        )
        $tessdata = $tessdataCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

        "TESSERACT_CMD=$tesseractExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "TESSERACT_PATH=$tesseractExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if ($tessdata) {
          "TESSDATA_PREFIX=$tessdata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        $tessRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        Write-Host "Tesseract executable: $tesseractExe"
        if ($tessdata) {
          Write-Host "Tessdata directory: $tessdata"
        }
        & $tesseractExe --version

    - name: Download fonts
      run: python scripts/download_all_fonts_final.py

    - name: Run Desktop Test Suite
      run: pytest -q

    - name: Run Backend Test Suite
      shell: pwsh
      working-directory: backend
      env:
        DB_USER: test
        DB_PASSWORD: test
        JWT_SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        ADMIN_API_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        APP_VERSION_UPDATE_API_KEY: test_update_api_key_for_ci_abcdefghijklmnopqrstuvwxyz123456
        BILLING_KEY_ENCRYPTION_KEY: uKVciQZlzUKtZPwuiKHl3wVCJJhQrWL6TqrFRClcEOI=
      run: |
        Remove-Item Env:PYTHONUTF8 -ErrorAction SilentlyContinue
        python -m pytest -q

    - name: Verify portable Alembic migration
      shell: pwsh
      working-directory: backend
      env:
        JWT_SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      run: |
        $dbPath = Join-Path $env:RUNNER_TEMP "backend-migration.db"
        $env:DATABASE_URL = "sqlite:///$($dbPath.Replace('\', '/'))"
        @'
        import os
        from sqlalchemy import create_engine, text
        engine = create_engine(os.environ["DATABASE_URL"])
        with engine.begin() as connection:
            connection.execute(text("CREATE TABLE users (id INTEGER PRIMARY KEY, username VARCHAR(50), password_hash VARCHAR(255))"))
            connection.execute(text("CREATE TABLE registration_requests (id INTEGER PRIMARY KEY)"))
            connection.execute(text("CREATE TABLE billing_keys (id INTEGER PRIMARY KEY, user_id VARCHAR(100), enc_bill VARCHAR(1024))"))
        '@ | python -
        python -m alembic upgrade head
        @'
        import os
        from sqlalchemy import create_engine, inspect
        tables = set(inspect(create_engine(os.environ["DATABASE_URL"])).get_table_names())
        required = {"admin_sessions", "work_usages", "system_settings", "user_logs", "alembic_version"}
        missing = required - tables
        if missing:
            raise SystemExit(f"Missing migrated tables: {sorted(missing)}")
        print("Alembic portability smoke passed")
        '@ | python -

    - name: Download Whisper models
      run: python scripts/download_whisper_models.py
      timeout-minutes: 10

    - name: Read baked release authorization
      id: baked_release
      shell: python
      run: |
        import os
        from utils.authenticode import PUBLIC_RELEASE_SIGNER_THUMBPRINTS, TRANSITION_BRIDGE_VERSION
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"transition_bridge_version={TRANSITION_BRIDGE_VERSION.strip().lstrip('vV')}\n")
            output.write(f"has_public_signer_pins={'true' if PUBLIC_RELEASE_SIGNER_THUMBPRINTS else 'false'}\n")

    - name: Resolve immutable release policy
      id: release_policy
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_SIGNING_MODE: ${{ inputs.signing_mode }}
        BAKED_TRANSITION_BRIDGE_VERSION: ${{ steps.baked_release.outputs.transition_bridge_version }}
        HAS_BAKED_PUBLIC_SIGNER_PINS: ${{ steps.baked_release.outputs.has_public_signer_pins }}
      run: |
        if ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "tag") {
          if ($env:REF_NAME -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Release tags must use exact vMAJOR.MINOR.PATCH format."
          }
          $version = $Matches.version
          $publish = "true"
          $bakedBridge = ($env:BAKED_TRANSITION_BRIDGE_VERSION ?? "").Trim().TrimStart("v")
          $hasPublicPins = ($env:HAS_BAKED_PUBLIC_SIGNER_PINS ?? "").Trim().ToLowerInvariant() -eq "true"
          if ($bakedBridge -and $version -eq $bakedBridge -and $hasPublicPins) {
            $signingMode = "integrity-bridge"
          } else {
            $signingMode = "public"
          }
          $isTag = "true"
        } else {
          $version = ($env:INPUT_VERSION ?? "").Trim().TrimStart("v")
          $publish = if (($env:INPUT_PUBLISH ?? "").Trim().ToLowerInvariant() -eq "true") { "true" } else { "false" }
          $signingMode = ($env:INPUT_SIGNING_MODE ?? "").Trim().ToLowerInvariant()
          $isTag = "false"
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "workflow_dispatch version must use MAJOR.MINOR.PATCH format."
          }
          if ($signingMode -notin @("public", "integrity-bridge")) {
            throw "Unsupported signing_mode: $signingMode"
          }
          if ($publish -eq "true") {
            throw "workflow_dispatch is candidate-only; only an existing pushed tag may publish."
          }
          if ($signingMode -eq "integrity-bridge") {
            Write-Host "Explicit integrity-bridge candidate selected; publication remains disabled."
          }
        }

        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "signing_mode=$signingMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "is_tag=$isTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Resolved version=$version publish=$publish signing_mode=$signingMode tag=$isTag"

    - name: Validate committed version contract
      shell: python
      env:
        VERSION: ${{ steps.release_policy.outputs.version }}
        SIGNING_MODE: ${{ steps.release_policy.outputs.signing_mode }}
        SIGN_CERT_THUMBPRINT: ${{ secrets.SIGN_CERT_THUMBPRINT }}
      run: |
        import json
        import os
        import re
        from pathlib import Path
        from utils.authenticode import validate_build_signing_configuration

        expected = os.environ["VERSION"].strip()
        committed = str(json.loads(Path("version.json").read_text(encoding="utf-8"))["version"]).strip()
        updater_text = Path("utils/auto_updater.py").read_text(encoding="utf-8")
        match = re.search(r'^CURRENT_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]', updater_text, re.MULTILINE)
        embedded = match.group(1).strip() if match else ""
        if expected != committed or expected != embedded:
            raise SystemExit(
                f"Release version must already be committed consistently: "
                f"requested={expected} version.json={committed} updater={embedded}"
            )
        signing_ok, signing_reason = validate_build_signing_configuration(
            os.environ["SIGNING_MODE"],
            expected,
            os.environ.get("SIGN_CERT_THUMBPRINT", ""),
        )
        if not signing_ok:
            raise SystemExit(f"Baked signing identity policy rejected the build: {signing_reason}")
        print(f"Committed version contract verified: {expected}")
        print(f"Baked signing identity contract verified: {signing_reason}")

    - name: Resolve release notes
      id: notes
      shell: bash
      env:
        VERSION: ${{ steps.release_policy.outputs.version }}
        IS_TAG: ${{ steps.release_policy.outputs.is_tag }}
      run: |
        SUMMARY=""
        if [ "$IS_TAG" = "true" ]; then
          git fetch origin "+refs/tags/v${VERSION}:refs/tags/v${VERSION}" --force 2>/dev/null || true
          SUMMARY="$(git tag -l --format='%(contents:subject)' "v${VERSION}" 2>/dev/null | head -n1)"
          HEAD_SUBJECT="$(git log -1 --format='%s' 2>/dev/null | head -n1)"
          if [ "$SUMMARY" = "$HEAD_SUBJECT" ]; then SUMMARY=""; fi
        fi
        if [ -z "$(printf '%s' "$SUMMARY" | tr -d '[:space:]')" ]; then
          SUMMARY="SSMaker v${VERSION}"
        fi
        echo "SUMMARY=${SUMMARY}" >> "$GITHUB_OUTPUT"
        echo "Resolved release notes: ${SUMMARY}"

    - name: Import Code Signing Certificate
      shell: pwsh
      env:
        SIGNING_MODE: ${{ steps.release_policy.outputs.signing_mode }}
        SIGN_CERT_THUMBPRINT: ${{ secrets.SIGN_CERT_THUMBPRINT }}
        SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
        SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
      run: |
        $thumb = (($env:SIGN_CERT_THUMBPRINT ?? "") -replace '\s', '').Trim().ToUpperInvariant()
        if ([string]::IsNullOrWhiteSpace($thumb)) {
          throw "A nonempty SIGN_CERT_THUMBPRINT is required as the expected signer for every build."
        }

        $pfxBase64 = $env:SIGN_CERT_PFX_BASE64 ?? ""
        $pfxPassword = $env:SIGN_CERT_PASSWORD ?? ""
        if (-not [string]::IsNullOrWhiteSpace($pfxBase64)) {
          if ([string]::IsNullOrWhiteSpace($pfxPassword)) {
            throw "SIGN_CERT_PASSWORD secret is required when SIGN_CERT_PFX_BASE64 is provided."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($pfxBase64))
          $securePwd = ConvertTo-SecureString $pfxPassword -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -Password $securePwd -CertStoreLocation Cert:\\CurrentUser\\My | Out-Null
          Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
        }

        $installed = Get-ChildItem Cert:\\CurrentUser\\My | Where-Object { $_.Thumbprint -eq $thumb } | Select-Object -First 1
        if (-not $installed) {
          throw "Code signing cert with thumbprint $thumb not found in Cert:\\CurrentUser\\My"
        }

        $codeSigningEku = "1.3.6.1.5.5.7.3.3"
        $ekuOids = @($installed.EnhancedKeyUsageList | ForEach-Object { [string]$_.ObjectId.Value })
        if ($codeSigningEku -notin $ekuOids) {
          throw "Expected signer does not contain the Code Signing EKU ($codeSigningEku)."
        }
        if ($env:SIGNING_MODE -eq "public" -and $installed.Subject -eq $installed.Issuer) {
          throw "Public signing mode rejects self-issued certificates."
        }

        "SIGN_CERT_THUMBPRINT=$thumb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build Installer
      shell: pwsh
      env:
        SSMAKER_SIGNING_MODE: ${{ steps.release_policy.outputs.signing_mode }}
      run: |
        ./scripts/build_exe.ps1

    - name: Verify app, installer, and installed uninstaller signing gates
      shell: pwsh
      env:
        VERSION: ${{ steps.release_policy.outputs.version }}
        SIGNING_MODE: ${{ steps.release_policy.outputs.signing_mode }}
        EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.SIGN_CERT_THUMBPRINT }}
      run: |
        $expectedThumb = (($env:EXPECTED_SIGNER_THUMBPRINT ?? "") -replace '\s', '').ToUpperInvariant()
        if ([string]::IsNullOrWhiteSpace($expectedThumb)) {
          throw "Release gate requires a nonempty expected signer thumbprint."
        }

        $signtool = Get-Command signtool -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue
        if (-not $signtool) {
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -ExpandProperty FullName -First 1
        }
        if (-not $signtool) { throw "signtool.exe was not found for the release verification gate." }

        function Assert-SigningGate([string]$Path, [string]$Label) {
          if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "$Label is missing: $Path" }
          $sig = Get-AuthenticodeSignature -LiteralPath $Path
          $actualThumb = ""
          if ($sig.SignerCertificate) {
            $actualThumb = (($sig.SignerCertificate.Thumbprint ?? "") -replace '\s', '').ToUpperInvariant()
          }
          if ($actualThumb -ne $expectedThumb) {
            throw "$Label signer mismatch (expected $expectedThumb, got $actualThumb)."
          }
          $ekuOids = @($sig.SignerCertificate.EnhancedKeyUsageList | ForEach-Object { [string]$_.ObjectId.Value })
          if ("1.3.6.1.5.5.7.3.3" -notin $ekuOids) {
            throw "$Label signer is missing the Code Signing EKU."
          }
          if ($null -eq $sig.TimeStamperCertificate) {
            throw "$Label is missing a trusted timestamp."
          }

          if ($env:SIGNING_MODE -eq "public") {
            if ($actualThumb -eq "4FE575D5119B0FC5DAFB6C1684B2968D340EE8F0") {
              throw "$Label uses the historical v1.5.64 signer, which is never public trust."
            }
            if ($sig.SignerCertificate.Subject -eq $sig.SignerCertificate.Issuer) {
              throw "$Label uses a self-issued signer in public mode."
            }
            if ([string]$sig.Status -ne "Valid") {
              throw "$Label requires Authenticode Status Valid in public mode; got $($sig.Status). UnknownError is rejected."
            }
            & $signtool verify /pa /all /v $Path
            if ($LASTEXITCODE -ne 0) { throw "$Label failed signtool verify /pa /all." }
          } elseif ([string]$sig.Status -notin @("Valid", "UnknownError")) {
            throw "$Label integrity-bridge signature is invalid: $($sig.Status)."
          }
        }

        $installer = Join-Path $PWD "dist\SSMaker_Setup_v$($env:VERSION).exe"
        $appExe = Join-Path $PWD "dist\ssmaker\ssmaker.exe"
        Assert-SigningGate $appExe "built application"
        Assert-SigningGate $installer "final installer"

        # Exercise the exact shipped Setup and directly validate the embedded,
        # installed Inno uninstaller instead of trusting SignedUninstaller=yes.
        $installRoot = Join-Path $env:RUNNER_TEMP "ssmaker-package-verification"
        if (Test-Path -LiteralPath $installRoot) {
          Remove-Item -LiteralPath $installRoot -Recurse -Force
        }
        & $installer "/DIR=$installRoot" "/VERYSILENT" "/SUPPRESSMSGBOXES" "/NORESTART" "/SP-" "/VERIFYPACKAGE"
        if ($LASTEXITCODE -ne 0) { throw "Silent installer verification failed with exit code $LASTEXITCODE." }

        $installedApp = Join-Path $installRoot "ssmaker.exe"
        $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter "unins*.exe" -File |
          Select-Object -ExpandProperty FullName -First 1
        if (-not $uninstaller) { throw "Silent install did not produce an Inno uninstaller." }
        Assert-SigningGate $installedApp "installed application"
        Assert-SigningGate $uninstaller "installed Inno uninstaller"
        Write-Host "All signing gates passed for mode $($env:SIGNING_MODE)."

    - name: Compute installer SHA256
      id: hash
      shell: pwsh
      env:
        VERSION: ${{ steps.release_policy.outputs.version }}
      run: |
        $version = $env:VERSION
        $installer = "dist/SSMaker_Setup_v${version}.exe"
        $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLower()
        $size = (Get-Item -LiteralPath $installer).Length
        Write-Host "SHA256: $hash ($size bytes)"
        "FILE_HASH=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "FILE_SIZE=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "$hash  SSMaker_Setup_v${version}.exe" | Set-Content -Path "dist/SSMaker_Setup_v${version}.exe.sha256" -Encoding ascii

    - name: Verify candidate asset hash before any publication
      shell: pwsh
      env:
        VERSION: ${{ steps.release_policy.outputs.version }}
        EXPECTED_HASH: ${{ steps.hash.outputs.FILE_HASH }}
      run: |
        if ($env:EXPECTED_HASH -notmatch '^[a-f0-9]{64}$') { throw "Computed SHA256 output is malformed." }
        $installer = "dist/SSMaker_Setup_v$($env:VERSION).exe"
        $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:EXPECTED_HASH) {
          throw "Candidate asset changed after signing (expected $($env:EXPECTED_HASH), got $actual)."
        }
        Write-Host "Pre-publication asset hash verified: $actual"

    - name: Upload verified candidate artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: SSMaker-${{ steps.release_policy.outputs.version }}-${{ steps.release_policy.outputs.signing_mode }}-candidate
        path: |
          dist/SSMaker_Setup_v${{ steps.release_policy.outputs.version }}.exe
          dist/SSMaker_Setup_v${{ steps.release_policy.outputs.version }}.exe.sha256
        if-no-files-found: error
        retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Download verified candidate artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: SSMaker-${{ needs.build.outputs.version }}-${{ needs.build.outputs.signing_mode }}-candidate
        path: dist

    - name: Recompute candidate hash across trust boundary
      shell: pwsh
      env:
        VERSION: ${{ needs.build.outputs.version }}
        EXPECTED_HASH: ${{ needs.build.outputs.file_hash }}
      run: |
        if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Build output version is malformed." }
        if ($env:EXPECTED_HASH -notmatch '^[a-f0-9]{64}$') { throw "Build output hash is malformed." }
        $installer = "dist/SSMaker_Setup_v$($env:VERSION).exe"
        $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:EXPECTED_HASH) {
          throw "Downloaded candidate hash mismatch (expected $($env:EXPECTED_HASH), got $actual)."
        }
        Write-Host "Publish-job candidate hash verified: $actual"

    - name: Reject non-monotonic release publication
      shell: python
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.build.outputs.version }}
        EXPECTED_HASH: ${{ needs.build.outputs.file_hash }}
        EXPECTED_SIZE: ${{ needs.build.outputs.file_size }}
        REPOSITORY: ${{ github.repository }}
      run: |
        import hashlib
        import json
        import os
        import re
        import urllib.request

        candidate = os.environ["VERSION"]
        expected_hash = os.environ["EXPECTED_HASH"]
        expected_size = int(os.environ["EXPECTED_SIZE"])
        if expected_size <= 0:
            raise SystemExit("Candidate installer size must be positive")
        api_root = f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
        headers = {
            "Accept": "application/vnd.github+json",
            "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
            "User-Agent": "SSMaker-Release-Monotonicity-Gate",
            "X-GitHub-Api-Version": "2022-11-28",
        }
        semver = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
        parse = lambda value: tuple(int(part) for part in value.split("."))

        def api_json(path):
            request = urllib.request.Request(f"{api_root}{path}", headers=headers)
            with urllib.request.urlopen(request, timeout=30) as response:
                return json.load(response)

        def paginated(path):
            page = 1
            while True:
                separator = "&" if "?" in path else "?"
                items = api_json(f"{path}{separator}per_page=100&page={page}")
                if not isinstance(items, list):
                    raise SystemExit(f"GitHub API returned a non-list for {path}")
                yield from items
                if len(items) < 100:
                    return
                page += 1

        candidate_tuple = parse(candidate)
        candidate_draft = None
        published_versions = []
        for release in paginated("/releases"):
            version = str(release.get("tag_name") or "").lstrip("vV")
            if not semver.fullmatch(version):
                continue
            version_tuple = parse(version)
            if version_tuple > candidate_tuple:
                raise SystemExit(
                    f"Refusing version {candidate}: release v{version} already exists"
                )
            if version_tuple == candidate_tuple:
                if not release.get("draft"):
                    raise SystemExit(
                        f"Published release v{candidate} is immutable and cannot be replaced"
                    )
                if candidate_draft is not None:
                    raise SystemExit(f"Multiple drafts exist for v{candidate}")
                candidate_draft = release
            elif not release.get("draft"):
                published_versions.append(version_tuple)

        for tag in paginated("/tags"):
            version = str(tag.get("name") or "").lstrip("vV")
            if semver.fullmatch(version) and parse(version) > candidate_tuple:
                raise SystemExit(
                    f"Refusing version {candidate}: higher tag v{version} already exists"
                )

        if published_versions and candidate_tuple <= max(published_versions):
            raise SystemExit(
                f"Release v{candidate} must be newer than every published semantic version"
            )

        if candidate_draft is not None:
            installer_name = f"SSMaker_Setup_v{candidate}.exe"
            matching_assets = [
                asset
                for asset in candidate_draft.get("assets", [])
                if asset.get("name") == installer_name
            ]
            if len(matching_assets) > 1:
                raise SystemExit(f"Draft v{candidate} has duplicate installer assets")
            if matching_assets:
                asset = matching_assets[0]
                if int(asset.get("size") or -1) != expected_size:
                    raise SystemExit(
                        f"Draft v{candidate} installer size differs from this candidate"
                    )
                digest = str(asset.get("digest") or "").lower()
                if not digest:
                    asset_headers = {**headers, "Accept": "application/octet-stream"}
                    request = urllib.request.Request(asset["url"], headers=asset_headers)
                    sha256 = hashlib.sha256()
                    downloaded = 0
                    with urllib.request.urlopen(request, timeout=120) as response:
                        for chunk in iter(lambda: response.read(1024 * 1024), b""):
                            downloaded += len(chunk)
                            if downloaded > expected_size:
                                raise SystemExit(
                                    f"Draft v{candidate} installer exceeded expected size"
                                )
                            sha256.update(chunk)
                    if downloaded != expected_size:
                        raise SystemExit(
                            f"Draft v{candidate} installer download was truncated"
                        )
                    digest = f"sha256:{sha256.hexdigest()}"
                if digest != f"sha256:{expected_hash}":
                    raise SystemExit(
                        f"Draft v{candidate} installer digest differs from this candidate"
                    )
            print(f"Resuming hash-identical draft v{candidate}")
        else:
            print(f"Strict monotonic release gate passed for new version v{candidate}")

    - name: Create draft Release with verified local assets
      uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
      with:
        tag_name: v${{ needs.build.outputs.version }}
        draft: true
        files: |
          dist/SSMaker_Setup_v${{ needs.build.outputs.version }}.exe
          dist/SSMaker_Setup_v${{ needs.build.outputs.version }}.exe.sha256
        name: Release v${{ needs.build.outputs.version }}
        generate_release_notes: true
        body: |
          ## SSMaker v${{ needs.build.outputs.version }}

          SSMaker v${{ needs.build.outputs.version }}

          ### 설치 방법
          1. 설치 파일을 실행하면 기존 설치를 감지합니다.
          2. 일반적으로는 `업데이트(Update)`를 선택하면 됩니다.
          3. 시작 오류를 겪은 경우에는 `재설치(Reinstall)`를 선택하세요.

          ### SHA256
          `${{ needs.build.outputs.file_hash }}`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify draft GitHub release asset hash
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.build.outputs.version }}
        EXPECTED_HASH: ${{ needs.build.outputs.file_hash }}
      run: |
        $downloadDir = Join-Path $env:RUNNER_TEMP "published-release-asset"
        New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
        gh release download "v$($env:VERSION)" --repo "${{ github.repository }}" --pattern "SSMaker_Setup_v$($env:VERSION).exe" --dir $downloadDir --clobber
        if ($LASTEXITCODE -ne 0) { throw "Could not download the published release asset for verification." }
        $downloaded = Join-Path $downloadDir "SSMaker_Setup_v$($env:VERSION).exe"
        $actual = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:EXPECTED_HASH) {
          throw "Draft release asset hash mismatch (expected $($env:EXPECTED_HASH), got $actual)."
        }
        Write-Host "Draft release asset hash verified: $actual"

    - name: Publish verified GitHub release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        gh release edit "v$($env:VERSION)" --repo "${{ github.repository }}" --draft=false --latest --verify-tag
        if ($LASTEXITCODE -ne 0) { throw "Verified draft release could not be published." }

    - name: Update server version API
      shell: python
      env:
        VERSION: ${{ needs.build.outputs.version }}
        FILE_HASH: ${{ needs.build.outputs.file_hash }}
        REPOSITORY: ${{ github.repository }}
        RELEASE_NOTES_SUMMARY: SSMaker v${{ needs.build.outputs.version }}
        APP_VERSION_API_BASE_URL: ${{ secrets.APP_VERSION_API_BASE_URL }}
        APP_VERSION_UPDATE_API_KEY: ${{ secrets.APP_VERSION_UPDATE_API_KEY }}
        APP_VERSION_UPDATE_HMAC_KEY: ${{ secrets.APP_VERSION_UPDATE_HMAC_KEY }}
      run: |
        import hashlib
        import hmac
        import json
        import os
        import time
        import urllib.error
        import urllib.parse
        import urllib.request

        version = os.environ["VERSION"].strip()
        repository = os.environ["REPOSITORY"].strip()
        def clean_secret(name, default=""):
            return (os.environ.get(name) or default).strip().lstrip("\ufeff").strip()

        api_base_url = clean_secret("APP_VERSION_API_BASE_URL", "https://newshopping-shorts-auth.vercel.app").rstrip("/")
        parsed_api = urllib.parse.urlparse(api_base_url)
        allowed_origins = {
            "https://newshopping-shorts-auth.vercel.app",
        }
        origin = f"{parsed_api.scheme}://{parsed_api.netloc}"
        if origin not in allowed_origins or parsed_api.path not in ("", "/") or parsed_api.query or parsed_api.fragment:
            raise SystemExit("APP_VERSION_API_BASE_URL is not an approved update origin")
        download_url = f"https://github.com/{repository}/releases/download/v{version}/SSMaker_Setup_v{version}.exe"

        payload = {
            "version": version,
            "download_url": download_url,
            "release_notes": (os.environ.get("RELEASE_NOTES_SUMMARY") or f"SSMaker v{version} 업데이트").strip(),
            "is_mandatory": False,
            "file_hash": os.environ["FILE_HASH"].strip(),
        }
        body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")

        token = clean_secret("APP_VERSION_UPDATE_API_KEY")
        if not token:
            raise SystemExit("APP_VERSION_UPDATE_API_KEY is required")
        signing_key = clean_secret("APP_VERSION_UPDATE_HMAC_KEY")
        if not signing_key:
            raise SystemExit("APP_VERSION_UPDATE_HMAC_KEY is required")
        signature = hmac.new(signing_key.encode("utf-8"), body, hashlib.sha256).hexdigest()

        headers = {
            "Content-Type": "application/json",
            "Authorization": f"Bearer {token}",
        }
        headers["X-Update-Signature"] = signature
        request = urllib.request.Request(
            f"{api_base_url}/app/version/update",
            data=body,
            headers=headers,
            method="POST",
        )
        class RejectRedirects(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                raise urllib.error.HTTPError(req.full_url, code, "Redirect refused", headers, fp)
        opener = urllib.request.build_opener(RejectRedirects)
        for attempt in range(1, 6):
            try:
                with opener.open(request, timeout=30) as response:
                    print(f"Server version updated: {response.status}")
                    print(ascii(response.read().decode("utf-8", errors="replace")))
                break
            except urllib.error.HTTPError as exc:
                if exc.code < 500 or attempt == 5:
                    raise
                print(f"Version update attempt {attempt} returned HTTP {exc.code}; retrying")
                time.sleep(3)

        expected_contract = {
            "version": version,
            "download_url": payload["download_url"],
            "release_notes": payload["release_notes"],
            "file_hash": payload["file_hash"],
        }
        verified_contracts = None
        for attempt in range(1, 9):
            nonce = time.time_ns()
            endpoint_urls = {
                "version": f"{api_base_url}/app/version?verify={nonce}",
                "check": f"{api_base_url}/app/version/check?current_version=0.0.0&verify={nonce}",
                "legacy": f"{api_base_url}/free/lately/?item=1&verify={nonce}",
            }
            raw_contracts = {}
            for name, endpoint_url in endpoint_urls.items():
                verify_request = urllib.request.Request(
                    endpoint_url,
                    headers={"Cache-Control": "no-cache", "User-Agent": "SSMaker-Release-Verification"},
                )
                with urllib.request.urlopen(verify_request, timeout=30) as response:
                    raw_contracts[name] = json.loads(response.read().decode("utf-8"))

            verified_contracts = {
                "version": {
                    key: raw_contracts["version"].get(key)
                    for key in expected_contract
                },
                "check": {
                    "version": raw_contracts["check"].get("latest_version"),
                    **{
                        key: raw_contracts["check"].get(key)
                        for key in ("download_url", "release_notes", "file_hash")
                    },
                },
                "legacy": {
                    key: raw_contracts["legacy"].get(key)
                    for key in expected_contract
                },
            }
            if all(contract == expected_contract for contract in verified_contracts.values()):
                break
            print(
                f"Public version contract verification attempt {attempt} did not converge; retrying: "
                f"{verified_contracts!r}"
            )
            time.sleep(2)
        else:
            raise SystemExit(
                "Public version endpoints disagree after update: "
                f"expected={expected_contract!r} actual={verified_contracts!r}"
            )
        print(f"All public version contracts verified: {expected_contract!r}")

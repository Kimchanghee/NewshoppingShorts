name: Build Microsoft Store MSIX

on:
  push:
    tags:
      - 'store-v*'
  workflow_dispatch:
    inputs:
      identity_name:
        description: Partner Center Product identity > Package/Identity/Name
        required: false
        default: YMcompany.SSMaker
        type: string
      publisher:
        description: Partner Center Product identity > Package/Identity/Publisher
        required: false
        default: CN=447AAE61-8C19-4267-91D6-45419445A405
        type: string
      publisher_display_name:
        description: Partner Center Product identity > Package/Properties/PublisherDisplayName
        required: false
        default: YMcompany
        type: string
      publish_to_store:
        description: Submit the verified MSIX to Microsoft Store product 9P43TQHLP8WH
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: microsoft-store-msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-store-package:
    runs-on: windows-latest
    timeout-minutes: 90
    # Configure microsoft-store-production with required reviewers, store-v*
    # tag restrictions, and Partner Center secrets. The candidate environment
    # must not contain production credentials.
    environment:
      name: ${{ github.event_name == 'push' && 'microsoft-store-production' || 'microsoft-store-candidate' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Resolve Store release contract
      id: store_contract
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_IDENTITY_NAME: ${{ inputs.identity_name }}
        INPUT_PUBLISHER: ${{ inputs.publisher }}
        INPUT_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        INPUT_PUBLISH: ${{ inputs.publish_to_store }}
      run: |
        $requestedPublish = ($env:INPUT_PUBLISH ?? "").Trim().ToLowerInvariant() -eq "true"
        if ($env:EVENT_NAME -eq "workflow_dispatch" -and $requestedPublish) {
          throw "workflow_dispatch is candidate-only; Store publication requires an immutable store-vMAJOR.MINOR.PATCH tag push."
        }
        $publish = $env:EVENT_NAME -eq "push"
        if ($env:EVENT_NAME -eq "push" -and $env:REF_NAME -notmatch '^store-v[0-9]+\.[0-9]+\.[0-9]+$') {
          throw "Store release tags must use store-vMAJOR.MINOR.PATCH."
        }
        $committedVersion = [string](Get-Content -Raw "version.json" | ConvertFrom-Json).version
        if ($committedVersion -match '[\r\n]' -or -not [regex]::IsMatch($committedVersion, '\A[0-9]+\.[0-9]+\.[0-9]+\z')) {
          throw "Committed Store version must use exact MAJOR.MINOR.PATCH format without line breaks."
        }
        if ($env:EVENT_NAME -eq "push") {
          $tagVersion = $env:REF_NAME.Substring("store-v".Length)
          if ($tagVersion -ne $committedVersion) {
            throw "Store tag/version mismatch: tag=$tagVersion version.json=$committedVersion"
          }
        }
        $identity = if ($env:INPUT_IDENTITY_NAME) { $env:INPUT_IDENTITY_NAME } else { "YMcompany.SSMaker" }
        $publisher = if ($env:INPUT_PUBLISHER) { $env:INPUT_PUBLISHER } else { "CN=447AAE61-8C19-4267-91D6-45419445A405" }
        $displayName = if ($env:INPUT_PUBLISHER_DISPLAY_NAME) { $env:INPUT_PUBLISHER_DISPLAY_NAME } else { "YMcompany" }
        foreach ($candidate in @($identity, $publisher, $displayName)) {
          if ($candidate -match '[\r\n]') {
            throw "Store identity inputs must not contain CR or LF characters."
          }
        }
        if ($identity -notmatch '^[A-Za-z0-9][A-Za-z0-9.-]{0,99}$') {
          throw "Store identity_name contains unsupported characters."
        }
        if ($publisher -notmatch '^CN=[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$') {
          throw "Store publisher must use the approved CN=<GUID> shape."
        }
        if ($displayName -notmatch '^[\p{L}\p{N} ._-]{1,80}$') {
          throw "Store publisher_display_name contains unsupported characters."
        }
        "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "identity_name=$identity" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "publisher=$publisher" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "publisher_display_name=$displayName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "version=$committedVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Store contract: product=9P43TQHLP8WH version=$committedVersion publish=$publish identity=$identity"

    - name: Validate Partner Center publication credentials
      if: steps.store_contract.outputs.publish == 'true'
      shell: pwsh
      env:
        AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        SELLER_ID: ${{ secrets.SELLER_ID }}
      run: |
        $required = @(
          "AZURE_AD_APPLICATION_CLIENT_ID",
          "AZURE_AD_APPLICATION_SECRET",
          "AZURE_AD_TENANT_ID",
          "SELLER_ID"
        )
        $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
        if ($missing.Count -gt 0) {
          throw "Microsoft Store publication credentials are missing: $($missing -join ', ')"
        }

    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11.9'

    - name: Cache pip packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-store-pip-${{ hashFiles('requirements-release.lock') }}
        restore-keys: |
          ${{ runner.os }}-store-pip-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --disable-pip-version-check --require-hashes -r requirements-release.lock
        python -m pip check
        python -c "import Cython, PyInstaller; assert Cython.__version__ == '3.2.9'; assert PyInstaller.__version__ == '6.19.0'"

    - name: Install Tesseract OCR
      shell: pwsh
      run: ./scripts/install_pinned_tesseract.ps1

    - name: Download build assets
      shell: pwsh
      run: |
        python scripts/download_all_fonts_final.py
        python scripts/download_whisper_models.py

    - name: Run desktop test suite
      run: pytest -q

    - name: Build Store application payload
      shell: pwsh
      env:
        SSMAKER_EXPECTED_COMMIT_SHA: ${{ github.sha }}
        SSMAKER_EXPECTED_REF: ${{ github.ref }}
        SSMAKER_EXPECTED_RUN_ID: ${{ github.run_id }}
        SSMAKER_PACKAGE_TARGET: msix
      run: ./scripts/build_exe.ps1

    - name: Verify Store manifest, PE identity, and frozen link smoke gate
      shell: pwsh
      env:
        EXPECTED_PUBLISH: ${{ steps.store_contract.outputs.publish }}
        SSMAKER_EXPECTED_COMMIT_SHA: ${{ github.sha }}
        SSMAKER_EXPECTED_REF: ${{ github.ref }}
        SSMAKER_EXPECTED_RUN_ID: ${{ github.run_id }}
        SSMAKER_PACKAGE_TARGET: msix
      run: |
        $env:SOURCE_LINK_REPORT = Join-Path $PWD "build\coupang_link_contract_source.json"
        $env:FROZEN_LINK_REPORT = Join-Path $PWD "build\coupang_link_contract_frozen.json"
        $env:STAGING_BUILD_MANIFEST = Join-Path $PWD "build_staging\build_manifest.json"
        $env:FROZEN_BUILD_MANIFEST = Join-Path $PWD "dist\ssmaker\build_manifest.json"
        @'
        import json
        import os
        from pathlib import Path

        def load(name):
            path = Path(os.environ[name])
            if not path.is_file():
                raise SystemExit(f"Required Store build evidence is missing: {path}")
            return json.loads(path.read_text(encoding="utf-8"))

        def stable(report):
            return {
                "schema_version": report.get("schema_version"),
                "contract_id": report.get("contract_id"),
                "ok": report.get("ok"),
                "cases": [
                    {
                        "id": case.get("id"),
                        "accepted": case.get("accepted"),
                        "links": case.get("links"),
                        "reason_code": case.get("reason_code"),
                    }
                    for case in report.get("cases", [])
                ],
            }

        source = stable(load("SOURCE_LINK_REPORT"))
        frozen = stable(load("FROZEN_LINK_REPORT"))
        if source.get("ok") is not True or frozen != source:
            raise SystemExit("Store source/frozen Coupang link contract smoke reports differ or failed")

        staging_path = Path(os.environ["STAGING_BUILD_MANIFEST"])
        frozen_path = Path(os.environ["FROZEN_BUILD_MANIFEST"])
        if staging_path.read_bytes() != frozen_path.read_bytes():
            raise SystemExit("Store frozen build manifest differs from staging")
        manifest = json.loads(staging_path.read_text(encoding="utf-8"))
        expected = {
            "commit_sha": os.environ["SSMAKER_EXPECTED_COMMIT_SHA"].lower(),
            "ref": os.environ["SSMAKER_EXPECTED_REF"],
            "ci_run_id": os.environ["SSMAKER_EXPECTED_RUN_ID"],
            "package_target": "msix",
            "url_contract_id": source["contract_id"],
            "url_contract_schema_version": source["schema_version"],
        }
        mismatches = {
            key: (value, manifest.get(key))
            for key, value in expected.items()
            if manifest.get(key) != value
        }
        if mismatches:
            raise SystemExit(f"Store manifest external identity mismatch: {mismatches}")
        should_publish = os.environ.get("EXPECTED_PUBLISH", "").lower() == "true"
        if bool(manifest.get("publication_allowed")) != should_publish:
            raise SystemExit(
                "Store publication_allowed must be true only for an immutable store-v tag push"
            )
        print("Store source/frozen smoke and manifest identity gates passed")
        '@ | python -
        if ($LASTEXITCODE -ne 0) { throw "Store distribution contract verification failed." }

        $manifest = Get-Content -LiteralPath $env:STAGING_BUILD_MANIFEST -Raw | ConvertFrom-Json
        $appExe = Join-Path $PWD "dist\ssmaker\ssmaker.exe"
        $identity = (Get-Item -LiteralPath $appExe).VersionInfo
        $expectedFileVersion = "$($manifest.version).$($manifest.build_number)"
        if ($identity.ProductVersion -ne $manifest.version -or $identity.FileVersion -ne $expectedFileVersion) {
          throw "Store PE version identity mismatch (expected product/file $($manifest.version)/$expectedFileVersion, got $($identity.ProductVersion)/$($identity.FileVersion))."
        }
        if ($identity.PrivateBuild -ne $manifest.commit_short_sha) {
          throw "Store PE PrivateBuild mismatch (expected $($manifest.commit_short_sha), got $($identity.PrivateBuild))."
        }
        if ($identity.SpecialBuild -ne $manifest.url_contract_id) {
          throw "Store PE SpecialBuild mismatch (expected $($manifest.url_contract_id), got $($identity.SpecialBuild))."
        }

    - name: Build unsigned Store MSIX
      shell: pwsh
      env:
        MSIX_IDENTITY_NAME: ${{ steps.store_contract.outputs.identity_name }}
        MSIX_PUBLISHER: ${{ steps.store_contract.outputs.publisher }}
        MSIX_PUBLISHER_DISPLAY_NAME: ${{ steps.store_contract.outputs.publisher_display_name }}
      run: ./scripts/build_msix.ps1

    - name: Upload Store submission package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: SSMaker-Microsoft-Store-MSIX
        path: dist/store/*.msix
        if-no-files-found: error
        retention-days: 30

    - name: Configure Microsoft Store Developer CLI
      if: steps.store_contract.outputs.publish == 'true'
      uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      with:
        version: v0.4.0

    - name: Authenticate Microsoft Store Developer CLI
      if: steps.store_contract.outputs.publish == 'true'
      shell: pwsh
      env:
        AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        SELLER_ID: ${{ secrets.SELLER_ID }}
      run: |
        msstore reconfigure `
          --tenantId $env:AZURE_AD_TENANT_ID `
          --sellerId $env:SELLER_ID `
          --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
          --clientSecret $env:AZURE_AD_APPLICATION_SECRET

    - name: Submit package to Microsoft Store
      if: steps.store_contract.outputs.publish == 'true'
      shell: pwsh
      run: |
        $package = Get-ChildItem -LiteralPath "dist/store" -Filter "*.msix" | Select-Object -First 1
        if (-not $package) {
          throw "The verified Microsoft Store package was not found."
        }
        msstore publish $package.FullName --appId 9P43TQHLP8WH --verbose

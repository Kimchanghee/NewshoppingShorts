        <h1>SSMaker 공지사항</h1>
        <p>SSMaker 공지사항은 업데이트 안내와 초기 세팅 매뉴얼을 모아둔 공식 안내 페이지입니다.</p>
        <p>쿠팡 파트너스 채널 등록, Linktree 가입과 링크 세팅, 쿠팡 상품 링크 가져오기, YouTube OAuth 연결, 업로드 후 검수 방법을 개별 게시물로 제공합니다.</p>
        <ul>
        <li>
          <a href="/notice/spring-2026-new-subscriber-extra-month/index.html">신규 구독 1개월 추가 제공 이벤트</a>
          <p>2026년 4월 30일부터 2026년 5월 14일까지 신규 가입 후 구독 확정 시 1개월을 자동 추가하고, 2026년 5월 15일부터는 마감으로 표시되는 2주 한정 이벤트입니다.</p>
        </li>
        <li>
          <a href="/notice/coupang-partners-channel-setup/index.html">쿠팡 파트너스 초기 채널 등록 매뉴얼</a>
          <p>쿠팡 파트너스에 YouTube 채널 또는 Linktree 공개 프로필을 등록하고 승인 증빙 캡쳐를 준비하는 방법입니다.</p>
        </li>
        <li>
          <a href="/notice/linktree-signup-link-setup/index.html">Linktree 처음 가입 및 상품 링크 세팅 매뉴얼</a>
          <p>Linktree 가입, 관리자 Links 화면, 상품 링크 추가, 공개 프로필 상품 버튼 확인 방법입니다.</p>
        </li>
        <li>
          <a href="/notice/coupang-partners-product-link/index.html">쿠팡 파트너스 상품 링크 가져오기 매뉴얼</a>
          <p>쿠팡 파트너스에서 link.coupang.com/a/... 단축 링크를 만들고 SSMaker 풀자동 입력에 사용하는 방법입니다.</p>
        </li>
        <li>
          <a href="/notice/youtube-oauth-client-guide/index.html">YouTube 채널 연결용 Google Cloud OAuth 설정 가이드</a>
          <p>SSMaker YouTube Shorts 자동 업로드를 위한 Google Cloud YouTube Data API v3와 데스크톱 앱 OAuth JSON 설정 방법입니다.</p>
        </li>
        <li>
          <a href="/notice/youtube-google-cloud-oauth-screenshots/index.html">Google Cloud 실제 화면 캡쳐로 보는 YouTube OAuth 설정</a>
          <p>Google Cloud Console 실제 화면 기준으로 YouTube Data API v3와 데스크톱 OAuth 클라이언트 생성 단계를 확인합니다.</p>
        </li>
        <li>
          <a href="/notice/youtube-linktree-upload-check/index.html">업로드 후 YouTube·댓글·Linktree 검수 매뉴얼</a>
          <p>YouTube Shorts 업로드 후 상품명, 댓글, 구매 링크, Linktree 번호 링크가 제대로 반영됐는지 검수하는 방법입니다.</p>
        </li>
      </ul>

      <p>SSMaker는 중국 쇼핑 영상을 한국어 숏폼 콘텐츠로 변환하고 쿠팡 파트너스 단축 링크, YouTube Shorts, Linktree 운영 흐름을 연결하는 Windows 프로그램입니다.</p>

      <h2>주요 기능 6가지</h2>
      <ul>
        <li>AI 자막 감지 - OCR 기술로 중국어 자막을 자동 인식</li>
        <li>자동 자막 블러 - 원본 중국어 자막을 깔끔하게 제거</li>
        <li>AI 스크립트 생성 - 상품 정보 기반 한국어 세일즈 스크립트 자동 작성</li>
        <li>TTS 음성 합성 - 자연스러운 한국어 나레이션 자동 생성</li>
        <li>GPU 가속 처리 - NVIDIA CUDA 환경에서 더 빠른 영상 처리 지원</li>
        <li>링크 기반 단일·믹스 제작 - 한 작업에서 영상 링크 2~5개를 섞고, 대기 목록은 순서대로 안전하게 처리</li>
      </ul>

      </ul>

      <h2>운영 효과</h2>
      <ul>
        <li>반복 작업: 자막 감지, 블러, 번역, TTS, 내보내기 흐름을 한 화면에서 처리</li>

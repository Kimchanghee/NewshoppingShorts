        <h1>SSMaker 개인정보처리방침</h1>
        <p>시행일: 2026년 8월 6일</p>
        <p>YMcompany는 회원가입 및 인증을 위해 이름, 아이디, 비밀번호의 단방향 해시, 연락처, 선택 입력 이메일, 가입·접속 IP, 로그인 및 앱 버전 기록을 처리합니다.</p>
        <p>구독 상태와 결제 식별자 및 처리 결과를 보관하며 카드 원문 전체를 직접 저장하지 않습니다. 대부분의 제작 데이터와 외부 서비스 인증 정보는 이용자의 PC에 저장됩니다.</p>
        <p>계정 생성과 본인 인증, 중복 로그인 방지, 무료 체험·구독 및 작업량 관리, 결제 처리, 고객 지원, 오류·보안 대응, 앱 업데이트 제공을 위해 정보를 이용합니다.</p>
        <p>이용자가 기능을 실행할 때 YouTube, Instagram, TikTok, Threads, Linktree, 쿠팡 파트너스, 생성형 AI 및 음성·영상 처리 서비스로 선택한 콘텐츠나 인증 정보가 전송될 수 있습니다.</p>
        <p>개인정보는 서비스 제공과 법적 의무 이행에 필요한 기간 동안만 보유하고 목적이 끝나면 삭제하거나 익명화합니다. 계정 정보의 열람·정정·삭제는 support@ssmaker.co.kr로 요청할 수 있습니다.</p>
        <p>전송 구간 암호화, 비밀번호 해시, 민감한 결제 키 암호화, 접근 권한 제한, 요청 속도 제한과 보안 로그 최소화를 적용합니다.</p>
        <p>SSMaker는 아동을 대상으로 설계된 서비스가 아니며 법정대리인의 동의 없이 아동의 개인정보를 의도적으로 수집하지 않습니다.</p>
